[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "objective-editing"
version = "0.1.0"
description = "How models rewrite their own constitution in service of aligned vs misaligned objectives"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.222", "pydantic>=2", "openai", "pandas"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["objective_editing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
